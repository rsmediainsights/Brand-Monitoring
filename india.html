<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch — RuralShores Media Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf5;
    --card: #ffffff;
    --border: #e7e2d3;
    --green: #2f5a1f;
    --green-dark: #1e3f13;
    --terracotta: #9a5a26;
    --gold: #b79b3d;
    --gold-light: #e0c34f;
    --text: #2a2b24;
    --muted: #78735f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  body { padding: 0 0 60px; }

  .masthead {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 24px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 3px solid var(--gold);
  }
  .masthead img { height: 64px; width: auto; flex-shrink: 0; }
  .masthead-text h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 32px;
    margin: 0 0 2px;
    color: var(--green-dark);
  }
  .masthead-text p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.04em;
  }

  .desk { max-width: 1040px; margin: 28px auto 0; padding: 0 24px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px;
    margin-bottom: 20px;
    box-shadow: 0 4px 18px -10px rgba(47,90,31,0.15);
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 18px; bottom: 18px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--gold);
  }
  .card-inner { padding-left: 16px; }
  .card h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin: 0 0 16px;
    font-weight: 600;
  }

  .keyword-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .kw-btn {
    padding: 14px 34px 14px 14px;
    border: 1.5px solid var(--border);
    background: #fdfcf8;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--green-dark);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    position: relative;
  }
  .kw-btn:hover { border-color: var(--green); background: #f4f8ef; transform: translateY(-1px); }
  .kw-btn::after {
    content: '→';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
  }

  #wireSearchForm { display: flex; gap: 10px; flex-wrap: wrap; }
  #wireQuery {
    flex: 1;
    min-width: 220px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    background: #fdfcf8;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }
  #wireQuery:focus { outline: none; border-color: var(--green); }

  button.run {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: var(--green);
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.run:hover { background: var(--green-dark); }

  .field-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  select.country-select {
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    background: #fdfcf8;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    margin-bottom: 18px;
    min-width: 220px;
  }
  select.country-select:focus { outline: none; border-color: var(--green); }

  .hint-row {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .hint-row a { color: var(--terracotta); }
</style>
</head>

  <div class="masthead-text">
    <h1>Dispatch</h1>
    <p>MEDIA MONITORING — RURALSHORES</p>
  </div>

<div class="desk">

  <div style="margin-bottom:16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
    <a href="index.html" style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--terracotta); text-decoration:none;">&larr; All countries</a>
  </div>

  <div class="card">
    <div class="card-inner">
      <h2>India — Category</h2>
      <label class="field-label" for="categorySelect">Select category / tier</label>
      <select class="country-select" id="categorySelect">
        <option value="Elite">Elite (5 sites)</option>
        <option value="Tier 1">Tier 1 (25 sites)</option>
        <option value="Trade">Trade (25 sites)</option>
      </select>

      <label class="field-label" for="dateRange" style="margin-top:14px;">Recency window</label>
      <select class="country-select" id="dateRange">
        <option value="">Any time (pure relevance)</option>
        <option value="qdr:w">Past week</option>
        <option value="qdr:m" selected>Past month</option>
        <option value="qdr:y">Past year</option>
      </select>

      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <div style="flex:1; min-width:140px;">
          <label class="field-label" for="dateFrom">Or custom: From</label>
          <input type="date" id="dateFrom" class="country-select" style="width:100%;" />
        </div>
        <div style="flex:1; min-width:140px;">
          <label class="field-label" for="dateTo">To</label>
          <input type="date" id="dateTo" class="country-select" style="width:100%;" />
        </div>
      </div>
      <div class="hint-row" style="margin-top:10px; border-top:none; padding-top:0;">
        // if both From and To are set, they override the preset window above
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <h2>Quick Search — Keywords</h2>
      <div class="keyword-grid" id="keywordGrid"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <h2>Custom Search</h2>
      <form id="wireSearchForm" onsubmit="return goSearch(event)">
        <input type="text" id="wireQuery" placeholder="Type any other keyword..." autocomplete="off" />
        <button class="run" type="submit">Run Search</button>
      </form>
      <div class="hint-row">
        // relevance-ranked results within your chosen category + recency window, opens in a new tab
      </div>
    </div>
  </div>

</div>

<script>
  var KEYWORDS = ["Accenture", "Capgemini", "Cognizant", "Infosys", "TCS", "Deloitte", "HCL", "IBM", "Wipro"];

  var CATEGORY_DOMAINS = {
    "Elite": ["cnbctv18.com", "timesofindia.indiatimes.com", "economictimes.indiatimes.com", "ptinews.com", "livemint.com"],
    "Tier 1": ["business-standard.com", "thehindu.com", "thehindubusinessline.com", "economictimes.indiatimes.com", "moneycontrol.com", "forbesindia.com", "ndtvprofit.com", "nytimes.com", "ft.com", "wsj.com", "financialexpress.com", "fortuneindia.com", "businesstoday.in", "reuters.com", "aninews.in", "ians.in", "storyboard18.com", "thedrum.com", "hindustantimes.com", "newindianexpress.com", "indianexpress.com", "deccanherald.com", "informistmedia.com", "yourstory.com", "the-ken.com"],
    "Trade": ["techcircle.in", "expresscomputer.in", "dqindia.com", "pcquest.com", "ciol.com", "voicendata.com", "dqchannels.com", "cxotoday.com", "crn.com", "businessworld.in", "indianretailer.com", "indiaretailing.com", "techgig.com", "analyticsinsight.net", "communicationstoday.co.in", "manufacturingtodayindia.com", "peoplematters.in", "expresspharma.in", "bwhealthcareworld.businessworld.in", "autocarpro.in", "themachinist.in", "indiaai.gov.in", "financialexpress.com", "idg.in", "techcrunch.com"]
  };

  function formatForGoogle(isoDate) {
    var parts = isoDate.split("-");
    return parts[1] + "/" + parts[2] + "/" + parts[0];
  }

  function search(query) {
    var category = document.getElementById("categorySelect").value;
    var recency = document.getElementById("dateRange").value;
    var dateFrom = document.getElementById("dateFrom").value;
    var dateTo = document.getElementById("dateTo").value;
    var domains = CATEGORY_DOMAINS[category] || [];

    var siteFilter = domains.map(function(d) { return "site:" + d; }).join(" OR ");
    var fullQuery = "(" + siteFilter + ") " + query;

    var params = new URLSearchParams({ q: fullQuery });

    if (dateFrom && dateTo) {
      var tbsValue = "cdr:1,cd_min:" + formatForGoogle(dateFrom) + ",cd_max:" + formatForGoogle(dateTo);
      params.set("tbs", tbsValue);
    } else if (recency) {
      params.set("tbs", recency);
    }

    var url = "https://www.google.com/search?" + params.toString();
    window.open(url, "_blank");
  }

  function goSearch(e) {
    e.preventDefault();
    var q = document.getElementById("wireQuery").value.trim();
    if (!q) return false;
    search(q);
    return false;
  }

  var grid = document.getElementById("keywordGrid");
  KEYWORDS.forEach(function(kw) {
    var btn = document.createElement("button");
    btn.className = "kw-btn";
    btn.textContent = kw;
    btn.addEventListener("click", function() { search(kw); });
    grid.appendChild(btn);
  });
</script>
